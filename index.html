<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Middle-earth Misfits</title>
    <!--
      ✦ MIDDLE-EARTH MISFITS ✦
      For lore nerds who know Middle-earth doesn't start and end with Aragorn and Legolas.
      Hand-crafted by a caffeine-fueled digital ranger and chronic Silmarillion index-reader
      on a quest to ensure minor Gondorian guards and obscure Valinor deities get their due.
      No rings of power were forged (or harmed) in the making of this client-side site.
    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="fantasy-bg">
    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5">
        <div class="text-center mb-5 mt-4">
            <h1 class="display-4 fantasy-title mb-3 fw-bold">Middle-earth Misfits</h1>
            <p class="lead fantasy-subtitle">Discover your lesser-known counterpart in the legendarium.</p>
        </div>

        <div class="card fantasy-card p-4 p-md-5 mb-4 w-100" style="max-width: 600px;">
            <form id="matcherForm">
                <div class="mb-4">
                    <label for="raceSelect" class="form-label fantasy-label">Which race do you align with most?</label>
                    <select class="form-select fantasy-select" id="raceSelect">
                        <option value="" selected>Any lineage...</option>
                        <option value="Elf">Elf</option>
                        <option value="Human">Human</option>
                        <option value="Dwarf">Dwarf</option>
                        <option value="Hobbit">Hobbit</option>
                        <option value="Orc">Orc</option>
                        <option value="Maiar">Maiar</option>
                        <option value="Ainur">Ainur</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="realmSelect" class="form-label fantasy-label">Where would you prefer to dwell?</label>
                    <select class="form-select fantasy-select" id="realmSelect">
                        <option value="" selected>Anywhere the wind blows...</option>
                        <option value="Rivendell">Imladris (Rivendell)</option>
                        <option value="Gondor">Gondor</option>
                        <option value="Rohan">Rohan</option>
                        <option value="Shire">The Shire</option>
                        <option value="Mordor">Mordor</option>
                        <option value="Valinor">Valinor</option>
                        <option value="Lothlórien">Lothlórien</option>
                        <option value="Erebor">Erebor</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="genderSelect" class="form-label fantasy-label">Preferred Form?</label>
                    <select class="form-select fantasy-select" id="genderSelect">
                        <option value="" selected>Doesn't matter</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="d-flex gap-2 mt-5">
                    <button type="submit" class="btn btn-fantasy btn-lg flex-grow-1 position-relative" id="submitBtn">
                        <span class="btn-text">Reveal My Match</span>
                        <div class="spinner-border spinner-border-sm text-light ms-2 position-absolute top-50 translate-middle-y d-none"
                            style="right: 20px;" id="loadingSpinner" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                    <button type="button" class="btn btn-outline-fantasy btn-lg px-3" id="resetBtn"
                        title="Reset all filters">
                        Reset
                    </button>
                </div>
            </form>
        </div>

        <div class="alert alert-danger custom-alert d-none w-100 text-center shadow-lg" style="max-width: 600px;"
            id="errorAlert" role="alert">
            <h4 class="alert-heading font-cinzel mb-2" id="errorHeading">A Shadow Falls!</h4>
            <p class="mb-0 small" id="errorMessage">No characters matched your criteria.</p>
        </div>

        <div class="card result-card d-none w-100 text-center shadow-lg" style="max-width: 600px;" id="resultCard">
            <div class="card-body p-4 p-md-5">
                <h5 class="text-uppercase tracking-wide text-muted mb-2 small pt-sm-2">Your True Form</h5>
                <h2 class="display-5 fantasy-title mb-4" id="charName">Character Name</h2>

                <div class="row text-start justify-content-center mb-4 text-muted mx-auto" style="max-width: 440px;">
                    <div class="col-4 text-center px-1 mb-2">
                        <strong class="d-block text-accent fantasy-label mb-1">Race</strong>
                        <span id="charRace" class="small text-light">Unknown</span>
                    </div>
                    <div class="col-4 text-center px-1 mb-2 border-start border-end border-secondary border-opacity-25">
                        <strong class="d-block text-accent fantasy-label mb-1">Realm</strong>
                        <span id="charRealm" class="small text-light">Unknown</span>
                    </div>
                    <div class="col-4 text-center px-1 mb-2">
                        <strong class="d-block text-accent fantasy-label mb-1">Gender</strong>
                        <span id="charGender" class="small text-light">Unknown</span>
                    </div>
                </div>

                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 mt-3">
                    <a href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline-fantasy px-4"
                        id="referenceLink">
                        Read on Tolkien Gateway
                    </a>
                    <button type="button" class="btn btn-fantasy px-4" id="tryAgainBtn">
                        Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
